<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dataset Activity</title>
    <style>
      #items {
        list-style: none;
        padding: 0;
      }
      #items li {
        padding: 12px 16px;
        margin: 8px 0;
        border-radius: 6px;
        cursor: pointer;
        border: 2px solid transparent;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      #items li:hover {
        transform: translateX(5px);
        border-color: #2c7a4d;
      }

      /* CSS based on data-category */
      li[data-category="fruit"] {
        background-color: lightyellow;
      }
      li[data-category="vegetable"] {
        background-color: lightgreen;
      }
      li[data-category="dairy"] {
        background-color: lightblue;
      }

      #details {
        margin-top: 20px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 8px;
      }
      #details h2 {
        margin-top: 0;
        color: #2c7a4d;
      }
    </style>
  </head>
  <body>
    <h1>Dataset Activity</h1>
    <ul id="items">
      <li data-name="banana" data-category="fruit" data-color="yellow">
        Banana
      </li>
      <li data-name="carrot" data-category="vegetable" data-color="orange">
        Carrot
      </li>
      <li data-name="blueberry" data-category="fruit" data-color="blue">
        Blueberry
      </li>
    </ul>
    <div id="details"></div>

    <script type="module" src="datasets.js"></script>
  </body>
</html>
