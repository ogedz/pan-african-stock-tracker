<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track stocks across African exchanges in one dashboard" />
    <title>Pan-African Stock Tracker | Track African Stock Markets</title>
    <meta name="author" content="Monday Ogedengbe" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;500&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <!-- Header (loaded dynamically) -->
    <header class="app-header" id="main-header"></header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- App Layout -->
    <div class="app-layout">
      <aside id="sidebar" class="sidebar">
        <nav class="sidebar-nav" aria-label="Main navigation">
          <ul>
            <li><a href="/index.html" class="active"> Home</a></li>
            <li><a href="/pages/portfolio/"> Portfolio</a></li>
            <li><a href="/pages/watchlist/"> Watchlist</a></li>
            <li><a href="/pages/alerts/"> Alerts</a></li>
            <li><a href="/pages/settings/"> Settings</a></li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <h1 class="visually-hidden">Pan-African Stock Tracker</h1>

        <section class="market-snapshot">
          <h2>Market Snapshot</h2>
          <div id="market-snapshot">
            <p>Loading market data...</p>
          </div>
        </section>

        <section class="movers">
          <div class="movers-column">
            <h2>Top Gainers</h2>
            <ul id="top-gainers" class="movers-list">
              <li>Loading...</li>
            </ul>
          </div>
          <div class="movers-column">
            <h2>Top Losers</h2>
            <ul id="top-losers" class="movers-list">
              <li>Loading...</li>
            </ul>
          </div>
        </section>

        <section class="results">
          <h2>Search Results</h2>
          <ul id="stock-list" class="stock-list">
            <li>Search for stocks above.</li>
          </ul>
        </section>
      </main>
    </div>

    <!-- Footer (loaded dynamically) -->
    <footer id="main-footer"></footer>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
