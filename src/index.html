<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Pan-African Stock Tracker</title>
    <meta
      name="description"
      content="Track NGX, JSE, and EGX stocks in one dashboard. Live prices, market snapshot, gainers, losers, portfolio, and watchlist for African retail investors."
    />
    <meta name="author" content="Monday Ogedengbe" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta property="og:title" content="Pan-African Stock Tracker" />
    <meta
      property="og:description"
      content="Unified dashboard for African stock exchanges — search, portfolio, alerts, and currency conversion."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://pan-african-stock-tracker.onrender.com/"
    />
    <meta
      property="og:image"
      content="https://pan-african-stock-tracker.onrender.com/images/social-share.png"
    />
    <meta property="og:site_name" content="Pan-African Stock Tracker" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pan-African Stock Tracker" />
    <meta
      name="twitter:description"
      content="Unified dashboard for African stock exchanges — search, portfolio, alerts, and currency conversion."
    />
    <meta
      name="twitter:image"
      content="https://pan-african-stock-tracker.onrender.com/images/social-share.png"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header id="main-header" class="site-header"></header>

    <div class="search-bar">
      <label class="visually-hidden" for="searchInput">Search stocks</label>
      <input
        type="search"
        id="searchInput"
        placeholder="Search by ticker or company name..."
        autocomplete="off"
      />
      <label class="visually-hidden" for="exchangeFilter"
        >Filter by exchange</label
      >
      <select id="exchangeFilter">
        <option value="ALL">All exchanges</option>
      </select>
    </div>

    <main>
      <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
      <section id="snapshotSection">...</section>
      <h1 class="visually-hidden">Pan-African Stock Market Tracker</h1>

      <section id="snapshotSection" aria-labelledby="snapshotHeading">
        <h2 id="snapshotHeading">Market Snapshot</h2>
        <div id="snapshotGrid" class="snapshot-grid">
          <div
            class="spinner"
            role="status"
            aria-label="Loading market snapshot"
          ></div>
        </div>
      </section>

      <section id="searchResultsSection" hidden>
        <h2>Search Results</h2>
        <ul id="searchResultsList" class="stock-list"></ul>
      </section>

      <section
        id="gainersLosersSection"
        class="two-col"
        aria-label="Top movers"
      >
        <div>
          <h2>Top Gainers</h2>
          <ul id="gainersList" class="stock-list"></ul>
        </div>
        <div>
          <h2>Top Losers</h2>
          <ul id="losersList" class="stock-list"></ul>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
